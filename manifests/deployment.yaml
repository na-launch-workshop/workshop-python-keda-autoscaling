apiVersion: apps/v1
kind: Deployment
metadata:
  name: nba-scoreboard
  labels:
    app: nba-scoreboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nba-scoreboard
  template:
    metadata:
      labels:
        app: nba-scoreboard
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/openshift/nba-scoreboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
