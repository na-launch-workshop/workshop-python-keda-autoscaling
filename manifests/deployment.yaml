apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-python-keda-autoscaling
  labels:
    app: workshop-python-keda-autoscaling
    backstage.io/kubernetes-id: workshop-python-keda-autoscaling
spec:
  replicas: 0
  selector:
    matchLabels:
      app: workshop-python-keda-autoscaling
  template:
    metadata:
      labels:
        app: workshop-python-keda-autoscaling
        backstage.io/kubernetes-id: workshop-python-keda-autoscaling
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/openshift/workshop-python-keda-autoscaling:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keda-workshop-kafka-credentials
                  key: username
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keda-workshop-kafka-credentials
                  key: password
            - name: DEMO_PROCESSING_DELAY_MS
              value: "2500"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
