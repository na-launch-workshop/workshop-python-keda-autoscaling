# EDIT: set host to your scoreboard hostname — hostname only, no https:// prefix
# Example: nba-scoreboard-user1-devspaces.apps.cluster-tm766.dyn.redhatworkshops.io
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: nba-scoreboard
spec:
  hosts:
    - <YOUR-ROUTE-HOST>
  scaleTargetRef:
    name: nba-scoreboard
    kind: Deployment
    apiVersion: apps/v1
    port: 8080
    service: nba-scoreboard
  replicas:
    min: 0
    max: 5
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 10
      window: 1m
