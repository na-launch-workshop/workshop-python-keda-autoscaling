# EDIT this file to control the scaling

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workshop-python-keda-autoscaling
spec:
  scaleTargetRef:
    name: workshop-python-keda-autoscaling
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: kafka
      authenticationRef:
        name: keda-workshop-kafka-auth
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
        consumerGroup: keda-consumer-group
        topic: keda-events
        lagThreshold: "10"
        activationLagThreshold: "1"
        offsetResetPolicy: "earliest"
        sasl: scram_sha512
        tls: disable
