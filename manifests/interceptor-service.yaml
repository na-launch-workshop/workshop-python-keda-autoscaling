apiVersion: v1
kind: Service
metadata:
  name: keda-interceptor
  labels:
    app: nba-scoreboard
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: keda-interceptor
subsets:
  - addresses:
      # CLUSTER-SPECIFIC: update in GitLab on the day — interceptor Service ClusterIP (not a pod IP):
      #   oc get svc keda-add-ons-http-interceptor-proxy -n keda -o jsonpath='{.spec.clusterIP}'
      - ip: 172.231.41.100
    ports:
      - port: 8080
