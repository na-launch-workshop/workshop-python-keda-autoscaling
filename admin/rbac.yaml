# Lets participant workspaces create their HTTPScaledObject — the built-in
# edit role does not cover http.keda.sh. deploy-all.sh applies and binds it only if missing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keda-http-scaledobject-editor
rules:
  - apiGroups:
      - http.keda.sh
    resources:
      - httpscaledobjects
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
