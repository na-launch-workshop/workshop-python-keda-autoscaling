apiVersion: apps/v1
kind: Deployment
metadata:
  name: nba-scoreboard
  labels:
    app: nba-scoreboard
    backstage.io/kubernetes-id: workshop-python-keda-autoscaling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nba-scoreboard
  template:
    metadata:
      labels:
        app: nba-scoreboard
        backstage.io/kubernetes-id: workshop-python-keda-autoscaling
    spec:
      containers:
        - name: app
          image: quay.io/pknezevich/nba-scoreboard:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
