apiVersion: v1
kind: Service
metadata:
  name: keda-interceptor
  labels:
    app: nba-scoreboard
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: keda-interceptor
subsets:
  - addresses:
      # Filled in by deploy-all.sh with this cluster's keda-add-ons-http-interceptor-proxy ClusterIP
      - ip: INTERCEPTOR_IP
    ports:
      - port: 8080
