schemaVersion: 2.3.0
metadata:
  name: workshop-python-keda-http
  version: 1.0.0
  description: Event-Driven Autoscaling with KEDA HTTP Add-on
attributes:
  che-editor: vscode
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/udi-rhel9:latest
      env:
        - name: SCOREBOARD_URL
          value: ""
        - name: PATH
          value: /home/user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: pip-cache
          path: /home/user/.cache/pip
      cpuLimit: '2'
      cpuRequest: '500m'
      memoryLimit: '3Gi'
      memoryRequest: '1Gi'
      mountSources: true
  - name: pip-cache
    volume:
      size: 1G

commands:
  - id: install
    exec:
      label: "1. Install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m pip install --user -q -r requirements.txt"
      group:
        kind: build
        isDefault: true

  - id: get-url
    exec:
      label: "2. Get my scoreboard URL"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "oc get route nba-scoreboard -o jsonpath='https://{.spec.host}' 2>/dev/null && echo ''"

  - id: apply-httpscaledobject
    exec:
      label: "3. Apply HTTPScaledObject"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "oc apply -f manifests/httpscaledobject.yaml"
      group:
        kind: run
        isDefault: true

  - id: surge
    exec:
      label: "4. Run surge (simulate halftime traffic)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        URL=$(oc get route nba-scoreboard -o jsonpath='https://{.spec.host}/api/score' 2>/dev/null)
        python3.11 -m pip install --user -q requests 2>/dev/null
        python3.11 surge.py "$URL" 20 60
