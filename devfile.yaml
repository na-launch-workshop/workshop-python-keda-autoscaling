schemaVersion: 2.3.0
metadata:
  name: workshop-python-keda-http
  version: 1.0.0
  description: Event-Driven Autoscaling with KEDA HTTP Add-on
attributes:
  che-editor: vscode
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/udi-rhel9:latest
      env:
        - name: PATH
          value: /home/user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: pip-cache
          path: /home/user/.cache/pip
      cpuLimit: '2'
      cpuRequest: '500m'
      memoryLimit: '3Gi'
      memoryRequest: '1Gi'
      mountSources: true
  - name: pip-cache
    volume:
      size: 1G

commands:
  - id: deploy-scoreboard
    exec:
      label: "1. Deploy scoreboard"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        oc apply -f manifests/deployment.yaml \
                 -f manifests/service.yaml \
                 -f manifests/interceptor-service.yaml \
                 -f manifests/route.yaml
      group:
        kind: build
        isDefault: true

  - id: install
    exec:
      label: "2. Install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m pip install --user -q -r requirements.txt"

  - id: get-url
    exec:
      label: "3. Get my scoreboard URL"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      # CLUSTER-SPECIFIC: update apps domain in GitLab on the day — oc get ingresses.config cluster -o jsonpath='{.spec.domain}'
      commandLine: |
        NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        echo ""
        echo "Your scoreboard hostname (paste into httpscaledobject.yaml):"
        echo "nba-scoreboard-${NS}.apps.cluster-tm766.dyn.redhatworkshops.io"
        echo ""

  - id: surge
    exec:
      label: "4. Run surge (simulate halftime traffic)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      # CLUSTER-SPECIFIC: update apps domain in GitLab on the day — oc get ingresses.config cluster -o jsonpath='{.spec.domain}'
      commandLine: |
        NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        URL="https://nba-scoreboard-${NS}.apps.cluster-tm766.dyn.redhatworkshops.io/api/score"
        python3.11 surge.py "$URL" 20 86400

  - id: apply-httpscaledobject
    exec:
      label: "5. Apply HTTPScaledObject + enable KEDA routing"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        oc apply -f manifests/httpscaledobject.yaml &&
        oc patch route nba-scoreboard --type=json \
          -p='[{"op":"replace","path":"/spec/to/name","value":"keda-interceptor"}]' &&
        echo "Done — KEDA is now managing your scoreboard."
