schemaVersion: 2.3.0
metadata:
  name: workshop-python-keda-http
  version: 1.0.0
  description: Event-Driven Autoscaling with KEDA HTTP Add-on
attributes:
  che-editor: vscode
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/udi-rhel9:latest
      env:
        - name: PATH
          value: /home/user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: pip-cache
          path: /home/user/.cache/pip
      cpuLimit: '2'
      cpuRequest: '500m'
      memoryLimit: '3Gi'
      memoryRequest: '1Gi'
      mountSources: true
  - name: pip-cache
    volume:
      size: 1G

commands:
  - id: get-url
    exec:
      label: "1. Get my scoreboard URL"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        HOST=$(oc get route nba-scoreboard -o jsonpath='{.spec.host}') || {
          echo "❌ No scoreboard found in your namespace — ask the instructor."; exit 1; }
        echo ""
        echo "Your scoreboard hostname (paste into httpscaledobject.yaml):"
        echo "$HOST"
        echo ""
        echo "Open in a browser: https://$HOST"
        echo ""

  - id: apply-httpscaledobject
    exec:
      label: "2. Apply HTTPScaledObject + enable KEDA routing"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        # Refuse to apply someone else's hostname — it would hijack their traffic.
        F=manifests/httpscaledobject.yaml
        HOST=$(oc get route nba-scoreboard -o jsonpath='{.spec.host}')
        [ -f "$F" ] || { echo "❌ $F not found — create it first (Step 3)."; exit 1; }
        FOUND=$(grep -oE 'nba-scoreboard-[A-Za-z0-9.-]+' "$F" | grep '\.apps\.' | sort -u)
        if [ "$FOUND" != "$HOST" ]; then
          echo "❌ hosts in $F must be your own scoreboard hostname:"
          echo "     expected: $HOST"
          echo "     found:    ${FOUND:-<none>}"
          exit 1
        fi
        oc apply -f manifests/httpscaledobject.yaml &&
        oc patch route nba-scoreboard --type=json \
          -p='[{"op":"replace","path":"/spec/to/name","value":"keda-interceptor"}]' &&
        echo "Done — KEDA is now managing your scoreboard."
      group:
        kind: run
        isDefault: true

  - id: watch-pods
    exec:
      label: "3. Watch my pods"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "oc get deployment nba-scoreboard -w"
